<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/icon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#F4F2ED" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#141312" media="(prefers-color-scheme: dark)" />
		<script>
			(function() {
				try {
					var savedTheme = localStorage.getItem('theme');
					var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
					if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
						document.documentElement.classList.add('dark');
					} else {
						document.documentElement.classList.remove('dark');
					}
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body class="min-h-screen bg-[#F4F2ED] dark:bg-[#141312] text-[#2C2B29] dark:text-[#EDE9E1] selection:bg-[#2C2B29] selection:text-[#F4F2ED] dark:selection:bg-[#EDE9E1] dark:selection:text-[#141312] transition-colors duration-200">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
